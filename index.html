<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>終電まで、あと30分。</title>
<style>
:root{
  --bg:#0a0a12; --panel:rgba(12,12,22,.92); --line:rgba(255,255,255,.14);
  --text:#fff; --muted:#c9c3d8; --pink:#ff8bb9; --pink2:#ffc0d8; --gold:#ffd577; --violet:#9d8cff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;background:#07070d;color:var(--text)}
body{overflow:hidden}
button{font:inherit}
.game{position:relative;height:100dvh;overflow:hidden;background:radial-gradient(circle at 18% 10%,#3f2b55 0,#181526 38%,#090a12 78%)}
.game:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;opacity:.25;pointer-events:none}
.rain{position:absolute;inset:0;pointer-events:none;opacity:.14;background:repeating-linear-gradient(112deg,transparent 0 17px,rgba(255,255,255,.2) 18px,transparent 19px 31px);background-size:170px 150px;animation:rain .85s linear infinite}
@keyframes rain{to{background-position:-45px 150px}}
.topbar{position:absolute;top:0;left:0;right:0;z-index:8;padding:max(12px,env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:linear-gradient(rgba(8,8,14,.88),transparent)}
.top-left{display:flex;align-items:flex-start;gap:9px;min-width:0}
.home-btn{flex:none;display:inline-flex;align-items:center;gap:5px;width:auto;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(12,12,22,.78);color:#fff;cursor:pointer;backdrop-filter:blur(12px);font-size:12px;font-weight:800;line-height:1;box-shadow:0 8px 22px rgba(0,0,0,.24);transition:.16s}
.home-btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.14)}
.home-icon{font-size:15px;line-height:1}
.brand h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.03em}
.brand .sub{margin-top:2px;font-size:11px;color:var(--muted)}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.bar{width:110px;height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--pink));transition:.35s}
.status b{color:#fff}
.goal{color:var(--gold);font-weight:700}
.stage{position:absolute;inset:58px 0 242px;display:grid;place-items:center;padding:14px;z-index:2}
.frame{width:min(94vw,780px);aspect-ratio:16/9;max-height:min(56vh,585px);border-radius:28px;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.15);background:#000;position:relative}
.frame img{width:100%;height:auto;display:block;will-change:transform;transition:transform .35s ease}
.chapter-badge{position:absolute;left:18px;bottom:215px;z-index:8;background:linear-gradient(90deg,var(--pink),var(--pink2));color:#391b2b;padding:8px 14px;border-radius:11px 11px 0 0;font-size:14px;font-weight:850;box-shadow:0 10px 25px rgba(0,0,0,.35)}
.dialog{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:7;min-height:205px;background:var(--panel);border:1px solid var(--line);border-radius:0 18px 18px 18px;padding:18px 16px 14px;backdrop-filter:blur(16px);box-shadow:0 22px 54px rgba(0,0,0,.45)}
.speaker{font-size:12px;font-weight:750;color:var(--pink2);margin-bottom:5px}
#line{font-size:16px;line-height:1.74;min-height:58px;white-space:pre-line}
.choices{display:grid;gap:8px;margin-top:10px}
.choice,.next,.primary,.secondary,.menu-btn{width:100%;padding:11px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;text-align:left;cursor:pointer;transition:.16s}
.choice:hover,.next:hover,.primary:hover,.secondary:hover,.menu-btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.14)}
.next{display:none;text-align:center;background:linear-gradient(90deg,rgba(111,98,196,.38),rgba(201,97,140,.38))}
.menu-fab{position:absolute;right:14px;bottom:225px;z-index:8;width:auto;padding:8px 12px;border-radius:999px;font-size:12px}
.delta{position:absolute;right:18px;bottom:215px;z-index:9;font-weight:900;color:var(--pink2);opacity:0;transform:translateY(8px);transition:.22s;text-shadow:0 2px 8px rgba(0,0,0,.55)}
.delta.show{opacity:1;transform:translateY(0)}
.overlay{display:none;position:absolute;inset:0;z-index:30;background:rgba(8,8,15,.88);backdrop-filter:blur(14px);place-items:center;padding:22px;overflow:auto}
.card{width:min(580px,100%);background:linear-gradient(155deg,#26213b,#151420);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.55)}
.eyebrow{font-size:12px;color:var(--pink2);font-weight:850;letter-spacing:.12em}
.card h2{font-size:30px;margin:6px 0 10px}
.card p{line-height:1.75;color:#dad5e5;white-space:pre-line}
.chapter-list{display:grid;gap:10px;margin-top:16px}
.chapter-item{border:1px solid var(--line);border-radius:15px;padding:14px;background:rgba(255,255,255,.06)}
.chapter-item.playable{cursor:pointer}
.chapter-item.locked{opacity:.48}
.chapter-item .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chapter-item b{font-size:15px}
.chapter-item small{display:block;color:#bdb7ca;margin-top:4px}
.tag{font-size:12px;font-weight:800;color:#ffb7d2}
.lock{font-size:12px;color:#a9a2ba}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 8px}
.result-grid>div{padding:12px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.result-grid small{display:block;color:#b2acc1;margin-bottom:2px}.result-grid b{font-size:20px}
.teaser{margin:14px 0 0;padding:14px;border-left:3px solid var(--pink);background:rgba(255,255,255,.06);color:#ddd8e7;line-height:1.72;white-space:pre-line}
.primary{text-align:center;background:linear-gradient(90deg,#7566d4,#cf668f);font-weight:800;margin-top:10px}
.secondary{text-align:center;margin-top:10px}
@media(min-width:800px){
  .dialog{left:50%;right:auto;transform:translateX(-50%);width:min(790px,calc(100% - 40px))}
  .chapter-badge{left:calc(50% - 395px)}
  .menu-fab{right:calc(50% - 395px)}
  .delta{right:calc(50% - 395px)}
}
@media(max-width:560px){
  .bar{width:70px}.goal{display:none}.status{gap:5px}.brand h1{font-size:14px}
  .top-left{gap:6px}.home-btn{padding:7px 9px}.home-label{display:none}
  .stage{bottom:250px}.chapter-badge,.delta{bottom:224px}.menu-fab{bottom:232px}
}
</style>
</head>
<body>
<div class="game">
  <div class="rain"></div>
  <div class="topbar">
    <div class="top-left">
      <button class="home-btn" id="homeBtn" type="button" aria-label="ホーム画面に戻る" title="ホーム画面に戻る"><span class="home-icon">⌂</span><span class="home-label">ホーム</span></button>
      <div class="brand">
        <h1>終電まで、あと30分。</h1>
        <div class="sub" id="chapterLabel">里奈 ROUTE</div>
      </div>
    </div>
    <div class="status">
      <span>関係値</span><span class="bar"><i id="bar"></i></span>
      <b id="score">0</b><span id="scoreMax">/100</span><span class="goal" id="goal"></span>
    </div>
  </div>

  <div class="stage"><div class="frame"><img id="sceneImage" src="assets/scene_atlas_v10_720_q70.jpg" alt="scene image"></div></div>
  <div class="chapter-badge" id="badge">里奈</div>
  <button class="menu-btn menu-fab" id="openMenu">話数選択</button>
  <div class="delta" id="delta">+10</div>

  <div class="dialog">
    <div class="speaker" id="speaker">里奈</div>
    <div id="line"></div>
    <div class="choices" id="choices"></div>
    <button class="next" id="next">次へ</button>
  </div>

  <div class="overlay" id="menuOverlay">
    <div class="card">
      <div class="eyebrow">RINA ROUTE</div>
      <h2>里奈ルート</h2>
      <p>各話の関係値目標を達成すると、次の話が解放されます。第九話まで追加済み。選択肢の並び順は毎回ランダムで入れ替わります。</p>
      <div class="chapter-list" id="chapterList"></div>
      <button class="secondary" id="resetBtn">進行状況をリセット</button>
    </div>
  </div>

  <div class="overlay" id="resultOverlay">
    <div class="card">
      <div class="eyebrow" id="resultEyebrow">STORY CLEAR</div>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <div class="result-grid">
        <div><small>現在の関係値</small><b id="resultScore"></b></div>
        <div><small>クリア条件</small><b id="resultGoal"></b></div>
      </div>
      <div class="teaser" id="teaser"></div>
      <button class="primary" id="resultPrimary"></button>
      <button class="secondary" id="resultSecondary">話数選択へ</button>
    </div>
  </div>
</div>
<script>
const chapters = [
  {
    id: 1,
    title: "第一話　雨宿りの夜",
    target: 32,
    startScore: 0,
    clearTitle: "雨が止んでも",
    clearText: "駅の入口で、里奈は足を止めた。\n「今度は偶然じゃなくて……また一緒に帰りたいな」\n\nさっきまで降っていた雨は少し弱まり、二人の距離だけが静かに近づいていた。",
    teaser: "NEXT STORY\n第二話『雨が止んでも、その先へ』\n――同じ傘の下で、会社では話せなかった気持ちを少しずつ知っていく。",
    scenes: [
      {speaker:"里奈",sprite:0,text:"「あ……あなたも雨宿り？」\n会社帰り、駅前の小さな喫茶店。隣の部署の里奈と、偶然ふたりきりになった。",choices:[{label:"うん。まさか里奈さんに会うとは",delta:8,reaction:"素直な反応に、里奈が少し笑った。"},{label:"これは運命かもね",delta:5,reaction:"「そういうこと、さらっと言うんだ」里奈は少し照れたように目を細める。"},{label:"別に。すぐ帰るつもりだった",delta:1,reaction:"里奈は少しだけ視線を落とした。"}]},
      {speaker:"里奈",sprite:1,text:"「私、今日ちょっと失敗しちゃって。帰る前に気持ちを切り替えたくて」\nいつも明るい彼女が、珍しく弱音をこぼす。",choices:[{label:"話したくなったら聞くよ",delta:10,reaction:"「……ありがとう。そういうの、助かる」里奈の肩の力が少し抜けた。"},{label:"里奈さんでも失敗するんだ",delta:3,reaction:"「それ慰めになってる？」と苦笑いされた。"},{label:"今日は無理に元気じゃなくていいよ",delta:8,reaction:"「……その言い方、ずるいな」里奈はふっと笑った。"}]},
      {speaker:"里奈",sprite:2,text:"里奈はカップを両手で包みながら窓の外を見る。\n「雨、止まないね。終電まであと20分か……」",choices:[{label:"タクシー呼ぼうか？",delta:4,reaction:"「優しいね。でも、もう少しここにいたいかも」"},{label:"もう少し降っててもいいかも",delta:10,reaction:"里奈は一瞬きょとんとして、それから頬を緩めた。\n「……私も、ちょっとそう思った」"},{label:"走ればまだ間に合うよ",delta:0,reaction:"「現実的だなあ」と笑われた。"}]},
      {speaker:"里奈",sprite:3,text:"「ねえ。会社だと、私とあんまり話さないよね？」\n不意に、里奈がこちらを見る。",choices:[{label:"緊張するから",delta:10,reaction:"「……それ、私のせい？」照れたように目を逸らした。"},{label:"仕事中は集中してるだけ",delta:5,reaction:"「そっか。真面目なんだね」"},{label:"話すきっかけがなかったから",delta:1,reaction:"「それはそうなんだけど……」里奈は少し唇を尖らせた。"}]},
      {speaker:"里奈",sprite:4,text:"店員が閉店時間を告げる。外を見ると、雨はいつの間にか小降りになっていた。\n里奈は傘を開き、少し迷ってからあなたを見る。\n「駅まで……一緒に行く？」",choices:[{label:"もちろん。入れてもらっていい？",delta:10,reaction:"「近いけど……濡れるよりいいよね」肩が触れそうな距離で、里奈がやわらかく笑った。"},{label:"俺の傘もあるよ。並んで行こう",delta:6,reaction:"「うん。それもいいね」里奈は歩幅をそっと合わせてくれる。"},{label:"先に行ってて",delta:0,reaction:"「……分かった。また明日ね」里奈の声が少しだけ遠くなった。"}]}
    ]
  },
  {
    id: 2,
    title: "第二話　雨が止んでも、その先へ",
    target: 68,
    startScore: 32,
    clearTitle: "次の約束",
    clearText: "改札の前。終電の案内が流れる。\n里奈は一度ホームを見て、それからあなたに向き直った。\n\n「今日、偶然会えてよかった」\n「……次は、偶然じゃなくてもいい？」\n\nスマホに増えた一件の予定。二人の関係は、会社の外へもう一歩だけ進んだ。",
    teaser: "NEXT STORY\n第三話『はじめての約束』\n――休日。待ち合わせ場所に現れた里奈は、会社で見る姿と少し違っていて、二人の会話は“帰り道”の続きでは済まなくなっていく。",
    scenes: [
      {speaker:"里奈",sprite:5,text:"雨上がりの歩道。街灯が濡れたアスファルトに映っている。\n一本の傘に二人で入りながら、駅へ向かう。\n「……雨、もう止みそうなのに。まだ傘、差してるね」",choices:[{label:"里奈さんが濡れたら困るから",delta:6,reaction:"「ふふ。もうほとんど降ってないよ？」と言いながらも、里奈は傘の下に寄った。"},{label:"もう少しこのままでいたい",delta:10,reaction:"「……うん。じゃあ、駅までこのまま」里奈は傘を閉じなかった。"},{label:"なんとなく、かな",delta:3,reaction:"「なんとなくで優しいことできるの、ずるいよね」里奈が笑う。"}]},
      {speaker:"里奈",sprite:6,text:"信号待ちで足を止める。里奈があなたの顔を見上げ、小さく息を吐いた。\n「私ね、さっき失敗したって言ったでしょ。あれ、本当は……あなたに聞いてほしかったのかも」",choices:[{label:"どうして俺に？",delta:8,reaction:"「なんでだろ。前から、話しやすそうって思ってた」里奈は少し照れながら答えた。"},{label:"もっと早く話してくれればよかったのに",delta:10,reaction:"「会社で？ 無理だよ。意識してるってバレそうだもん」言った直後、里奈は自分で赤くなった。"},{label:"誰かに話せてよかったね",delta:2,reaction:"「……うん、でも“誰か”じゃなくてよかった」里奈の声は小さかった。"}]},
      {speaker:"里奈",sprite:7,text:"駅に着くと、雨の影響で電車が少し遅れていた。\n発車まであと12分。里奈は自販機の前で立ち止まる。\n「まだ時間あるね。……あったかいの、飲む？」",choices:[{label:"温かい飲み物、奢るよ",delta:8,reaction:"「じゃあ……ほうじ茶にしようかな。今日だけ甘えていい？」里奈は少し嬉しそうに笑う。"},{label:"俺も喉かわいてた",delta:5,reaction:"「じゃあ一緒に選ぼ」里奈は自販機の前で少し身を寄せた。"},{label:"ホームで待とうか",delta:1,reaction:"「そっか。じゃあ行こっか」会話が少しだけ途切れた。"}]},
      {speaker:"里奈",sprite:8,text:"缶を両手で温めながら、里奈が横目でこちらを見る。\n「私たち、こうやって話すの初めてなのに……変な感じしないね」",choices:[{label:"前から話してみたかった",delta:10,reaction:"「……それ、もっと早く言ってよ」嬉しそうなのに、目は合わせてくれない。"},{label:"里奈が話しやすいから",delta:7,reaction:"「それ褒めてる？ なら嬉しいけど」里奈は缶を胸元で抱える。"},{label:"たまたま波長が合うのかも",delta:4,reaction:"「たまたま、か……でも、それも悪くないね」やさしい間が生まれた。"}]},
      {speaker:"里奈",sprite:9,text:"発車案内が更新される。あと5分。里奈はスマホを手の中で握り、少しだけ躊躇する。\n「ねえ。会社以外でも……また話したいって言ったら、困る？」",choices:[{label:"困らない。むしろ嬉しい",delta:10,reaction:"「……よかった」里奈の声が、さっきより少し近い。"},{label:"連絡先、交換する？",delta:9,reaction:"「うん。実は私も、それ言おうと思ってた」里奈はほっとしたように笑った。"},{label:"今度の休み、空いてる？",delta:10,reaction:"「……えっ、いきなり？」驚いたあと、里奈は嬉しそうに頷いた。\n「空ける。だから、ちゃんと誘って」"}]}
    ]
  },
  {
    id: 3,
    title: "第三話　はじめての約束",
    target: 92,
    startScore: 68,
    clearTitle: "また、明日も会いたい",
    clearText: "改札の光が滲む夜。帰る時間になっても、里奈は少しだけその場に残っていた。\n\n「今日、すごく楽しかった」\n「会社で会うのとは、もうちょっと違う顔……見せてもいいかなって思えたの」\n\n別れ際に交わした“またね”は、もう社交辞令じゃない。次の約束をした二人の距離は、確かに恋へ近づいていた。",
    teaser: "NEXT STORY\n第四話『君の知らない、私の話』\n――少し打ち解けた休日の続き。里奈がまだ誰にも話していない気持ちを、あなたにだけそっと明かしていく。",
    scenes: [
      {speaker:"里奈",sprite:10,text:"休日の駅前。待ち合わせ場所に現れた里奈は、いつものオフィス姿よりずっと柔らかい雰囲気だった。\n「ごめん、待った？ ……その、こういう服で会うの、ちょっと恥ずかしいね」",choices:[{label:"すごく似合ってる。ちゃんと見惚れた",delta:10,reaction:"「……もう。最初からそういうこと言うの反則」里奈は嬉しそうに笑いながら髪を耳にかけた。"},{label:"会社の時より、少し大人っぽいかも",delta:7,reaction:"「ほんと？ 今日は少しだけ頑張ったの」里奈の声が弾む。"},{label:"いつも通りに見えるけど",delta:1,reaction:"「えー……ちょっとくらい褒めてくれてもいいのに」里奈はむくれた。"}]},
      {speaker:"里奈",sprite:11,text:"駅近くのブックカフェ。里奈は一冊の本を手に取って、あなたに表紙を見せる。\n「こういう、読んだ後に少し優しくなれる話が好きなんだ。あなたは？」",choices:[{label:"里奈が好きなもの、もっと知りたい",delta:10,reaction:"「……それ、ずるいなあ」里奈は本を抱えたまま、照れくさそうに笑った。"},{label:"余韻が残る話は、俺も好き",delta:8,reaction:"「ほんと？ じゃあ今度おすすめ交換しようよ」里奈の目がきらっと輝く。"},{label:"普段はあまり本を読まないかも",delta:3,reaction:"「そっか。じゃあ私が最初の一冊、選んであげようかな」里奈は優しく言った。"}]},
      {speaker:"里奈",sprite:12,text:"日が傾き、川沿いの遊歩道を並んで歩く。里奈は夕焼けを背に振り返って、少しだけ足を止めた。\n「ねえ。今日の私、会社にいる時と……少し違って見える？」",choices:[{label:"今の里奈の方が、もっと好きかもしれない",delta:10,reaction:"里奈は一瞬息を止めてから、困ったように笑った。\n「……そんな顔で言われたら、嬉しくなっちゃう」"},{label:"肩の力が抜けてて、いい感じ",delta:7,reaction:"「そっか。あなたの前だと、変に頑張らなくていいのかも」里奈は夕焼けの方を見た。"},{label:"会社の時も今日も、どっちも里奈だよ",delta:6,reaction:"「……うん。それを分かってくれるの、ちょっと安心する」里奈は小さく頷いた。"}]},

const SAVE_KEY = 'lasttrain30_rina_v10';
const SPRITE_COUNT = 45;
const SPRITE_STEP = 100 / SPRITE_COUNT;
let save = { unlocked: 1, best: 0, chapterClear: {} };
try { save = { ...save, ...(JSON.parse(localStorage.getItem(SAVE_KEY)) || {}) }; } catch(e){}
function persist(){ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }

let chapterIndex = 0;
let sceneIndex = 0;
let relation = 0;
let waiting = false;
const $ = id => document.getElementById(id);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function updateScore(){
  const c = chapters[chapterIndex] || { target: 100 };
  $('score').textContent = relation;
  $('scoreMax').textContent = '/' + c.target;
  const ratio = Math.max(0.02, Math.min(1, relation / c.target));
  $('bar').style.width = (ratio * 100) + '%';
}
function startChapter(i){
  chapterIndex = i; sceneIndex = 0; waiting = false;
  const c = chapters[i];
  relation = Math.max(c.startScore, i===0 ? 0 : save.best);
  $('chapterLabel').textContent = '里奈 ROUTE　' + c.title;
  $('goal').textContent = '目標 ' + c.target;
  updateScore();
  $('menuOverlay').style.display = 'none';
  $('resultOverlay').style.display = 'none';
  render();
}
function render(){
  const c = chapters[chapterIndex];
  if(sceneIndex >= c.scenes.length){ finishChapter(); return; }
  const s = c.scenes[sceneIndex];
  $('sceneImage').style.transform = `translateY(-${s.sprite * SPRITE_STEP}%)`;
  $('badge').textContent = s.speaker || '里奈';
  $('speaker').textContent = s.speaker || '里奈';
  $('line').innerText = s.text;
  $('choices').innerHTML = '';
  $('next').style.display = 'none';
  waiting = false;
  const randomized = shuffle(s.choices);
  randomized.forEach(choice => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = choice.label;
    b.onclick = () => choose(choice);
    $('choices').appendChild(b);
  });
}
function choose(choice){
  if(waiting) return;
  waiting = true;
  relation = relation + choice.delta;
  save.best = Math.max(save.best, relation);
  persist();
  updateScore();
  $('choices').innerHTML = '';
  $('line').innerText = choice.reaction;
  $('next').style.display = 'block';
  if(choice.delta > 0){
    const d = $('delta'); d.textContent = '+' + choice.delta; d.classList.add('show');
    setTimeout(() => d.classList.remove('show'), 850);
  }
}
$('next').onclick = () => { sceneIndex++; render(); };

function openMenu(){
  $('menuOverlay').style.display = 'grid';
  const list = $('chapterList'); list.innerHTML = '';
  chapters.forEach((c, i) => {
    const unlocked = c.id <= save.unlocked;
    const item = document.createElement('div');
    item.className = 'chapter-item ' + (unlocked ? 'playable' : 'locked');
    const state = save.chapterClear[c.id] ? '<span class="tag">CLEAR</span>' : (unlocked ? '<span class="tag">PLAY</span>' : '<span class="lock">LOCK</span>');
    item.innerHTML = `<div class="row"><b>${c.title}</b>${state}</div><small>クリア条件：関係値 ${c.target} 以上</small>`;
    if(unlocked){ item.onclick = () => startChapter(i); }
    list.appendChild(item);
  });
}

function finishChapter(){
  const c = chapters[chapterIndex];
  const cleared = relation >= c.target;
  $('resultOverlay').style.display = 'grid';
  $('resultEyebrow').textContent = cleared ? 'STORY CLEAR' : 'STORY NOT CLEARED';
  $('resultTitle').textContent = cleared ? c.clearTitle : 'もう少し、近づけたら';
  $('resultText').innerText = cleared ? c.clearText : '里奈との距離は縮まった。けれど、まだ次の物語へ進むには少し足りない。';
  $('resultScore').textContent = relation;
  $('resultGoal').textContent = c.target;
  $('teaser').innerText = cleared ? c.teaser : `あと ${c.target - relation} ポイントでクリア。\n選択肢を変えて、この話をもう一度プレイできます。`;
  const p = $('resultPrimary');
  if(cleared){
    save.chapterClear[c.id] = true;
    save.unlocked = Math.max(save.unlocked, c.id + 1);
    persist();
    if(chapterIndex + 1 < chapters.length){
      p.textContent = '次の話へ進む';
      p.onclick = () => startChapter(chapterIndex + 1);
    }else{
      p.textContent = '第一話からもう一度';
      p.onclick = () => startChapter(0);
    }
  }else{
    p.textContent = 'この話をリトライ';
    p.onclick = () => startChapter(chapterIndex);
  }
}
$('resultSecondary').onclick = () => { $('resultOverlay').style.display = 'none'; openMenu(); };
$('homeBtn').onclick = () => {
  $('resultOverlay').style.display = 'none';
  openMenu();
};
$('openMenu').onclick = openMenu;
$('resetBtn').onclick = () => {
  if(confirm('進行状況をリセットしますか？')){
    save = { unlocked: 1, best: 0, chapterClear: {} };
    persist(); openMenu();
  }
};
openMenu();
</script>
